<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="weather-container">
        <header class="app-header">
            <h1>Clima Actual</h1>
            <p>Consultá el pronóstico en tiempo real</p>
        </header>

        <!-- Formulario de búsqueda -->
        <form id="search-form" class="search-box">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Ej: Córdoba, Madrid, Tokio..." 
                autocomplete="off"
                required
            >
            <button type="submit" id="search-btn">Buscar</button>
        </form>

        <!-- Estado de carga (oculto por defecto) -->
        <div id="loading" class="status-message hidden">
            <div class="spinner"></div>
            <p>Consultando satélite...</p>
        </div>

        <!-- Mensaje de error (oculto por defecto) -->
        <div id="error-box" class="error-message hidden">
            <p id="error-text">No se pudo encontrar la ciudad.</p>
        </div>

        <!-- Tarjeta de resultados del clima (oculta hasta que haya datos) -->
        <section id="weather-card" class="weather-card hidden">
            <div class="location-info">
                <h2 id="city-name">--</h2>
                <p id="weather-desc">--</p>
            </div>

            <div class="temp-display">
                <img id="weather-icon" src="" alt="Ícono del clima">
                <span id="temperature">--°C</span>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-label">Sensación</span>
                    <span id="feels-like" class="detail-value">--°C</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Humedad</span>
                    <span id="humidity" class="detail-value">--%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Viento</span>
                    <span id="wind-speed" class="detail-value">-- km/h</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Punto de entrada JS modular -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
